name: Linux packaging

# Fast checks for linux/packaging: shellcheck, and the container smoke tests
# run against a stand-in CLI tarball (tests/make-fake-tarball.sh). The real
# CLI goes through the same tests in release-usagebar.yml.

on:
  pull_request:
    paths:
      - 'linux/packaging/**'
      - '.github/workflows/linux-packaging.yml'
  push:
    branches: [main]
    paths:
      - 'linux/packaging/**'
      - '.github/workflows/linux-packaging.yml'

permissions:
  contents: read

concurrency:
  group: linux-packaging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shellcheck
        run: shellcheck -x linux/packaging/install-cli.sh linux/packaging/tests/*.sh

      - name: Stand-in CLI tarball
        run: linux/packaging/tests/make-fake-tarball.sh "$RUNNER_TEMP/fake" 9.9.9

      - name: install-cli.sh smoke test
        run: |
          set -euo pipefail
          for image in debian:stable registry.fedoraproject.org/fedora:latest; do
            echo "::group::install-cli.sh on $image"
            linux/packaging/tests/run-in-container.sh "$image" install-script.sh "$RUNNER_TEMP/fake"
            echo "::endgroup::"
          done
