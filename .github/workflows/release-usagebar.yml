name: Release UsageBar

# UsageBar's Linux packages: the GNOME extension plus this fork's codexbar CLI
# (upstream + `codexbar sync`) in one .deb and one .rpm per architecture.
# Pushing a usagebar-v<version> tag builds them and publishes the GitHub
# release the extension's updater reads. The release is created with
# GITHUB_TOKEN, so upstream's release-triggered workflows (release-cli.yml and
# its Homebrew tap dispatch, release-linux-desktop.yml) don't fire for it.

on:
  push:
    tags: ['usagebar-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a test build of the selected ref; never publishes'
        required: true
        default: '0.0.0'
        type: string

permissions:
  contents: read

concurrency:
  group: release-usagebar-${{ github.ref }}
  cancel-in-progress: false

env:
  SWIFT_VERSION: 6.3.3
  SWIFTLY_VERSION: 1.1.3
  SWIFTLY_SIGNING_FINGERPRINT: E813C892820A6FA13755B268F167DF1ACF9CE069

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-24.04
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == push ]]; then
            version=${TAG#usagebar-v}
          else
            version=$INPUT_VERSION
          fi
          # Dotted numbers only: the updater compares them numerically.
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "Invalid version: $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extension unit tests
        run: node --test linux/usagebar-gnome/tests/*.test.mjs

      - name: Restore Swift toolchain cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/swiftly
          key: swift-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_VERSION }}-swiftly-${{ env.SWIFTLY_VERSION }}

      - name: Install Swift ${{ env.SWIFT_VERSION }} via swiftly
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ca-certificates gpg libcurl4-openssl-dev libsqlite3-dev \
            rpm libglib2.0-bin

          SWIFTLY_ARCH="$(uname -m)"
          SWIFTLY_ARCHIVE="$RUNNER_TEMP/swiftly-${SWIFTLY_VERSION}-${SWIFTLY_ARCH}.tar.gz"
          SWIFTLY_SIGNATURE="${SWIFTLY_ARCHIVE}.sig"
          SWIFTLY_HOME_DIR="$HOME/.local/share/swiftly"
          SWIFTLY_BIN_DIR="$HOME/.local/bin"
          SWIFT_GNUPGHOME="$(mktemp -d)"
          SWIFT_KEYS="$RUNNER_TEMP/swift-signing-keys.asc"
          POST_INSTALL_SCRIPT="$(mktemp)"

          mkdir -p "$SWIFTLY_BIN_DIR"
          chmod 700 "$SWIFT_GNUPGHOME"
          curl -fsSL "https://download.swift.org/swiftly/linux/swiftly-${SWIFTLY_VERSION}-${SWIFTLY_ARCH}.tar.gz" -o "$SWIFTLY_ARCHIVE"
          curl -fsSL "https://download.swift.org/swiftly/linux/swiftly-${SWIFTLY_VERSION}-${SWIFTLY_ARCH}.tar.gz.sig" -o "$SWIFTLY_SIGNATURE"
          curl -fsSL --compressed "https://www.swift.org/keys/all-keys.asc" -o "$SWIFT_KEYS"
          GNUPGHOME="$SWIFT_GNUPGHOME" gpg --batch --import "$SWIFT_KEYS"
          SIGNATURE_STATUS="$(GNUPGHOME="$SWIFT_GNUPGHOME" gpg --batch --status-fd=1 \
            --verify "$SWIFTLY_SIGNATURE" "$SWIFTLY_ARCHIVE" 2>&1)"
          printf '%s\n' "$SIGNATURE_STATUS"
          grep -Fq "[GNUPG:] VALIDSIG ${SWIFTLY_SIGNING_FINGERPRINT} " <<< "$SIGNATURE_STATUS"
          tar -xzf "$SWIFTLY_ARCHIVE" -C /tmp
          /tmp/swiftly init --assume-yes --skip-install

          . "$SWIFTLY_HOME_DIR/env.sh"
          echo "$SWIFTLY_BIN_DIR" >> "$GITHUB_PATH"
          echo "SWIFTLY_HOME_DIR=$SWIFTLY_HOME_DIR" >> "$GITHUB_ENV"
          echo "SWIFTLY_BIN_DIR=$SWIFTLY_BIN_DIR" >> "$GITHUB_ENV"

          swiftly install "$SWIFT_VERSION" --use --assume-yes --verify --post-install-file "$POST_INSTALL_SCRIPT"
          if [[ -s "$POST_INSTALL_SCRIPT" ]]; then
            sudo apt-get update
            sudo bash "$POST_INSTALL_SCRIPT"
          fi

          hash -r
          swift --version

      - name: Build CodexBarCLI (release, static Swift stdlib)
        id: build
        run: |
          set -euo pipefail
          swift build -c release --product CodexBarCLI --static-swift-stdlib
          echo "bin_dir=$(swift build -c release --product CodexBarCLI --static-swift-stdlib --show-bin-path)" >> "$GITHUB_OUTPUT"

      # Same layout as upstream's release tarball, which build-packages.sh
      # unpacks into /usr/libexec/usagebar.
      - name: Package CLI tarball
        id: cli
        env:
          BIN_DIR: ${{ steps.build.outputs.bin_dir }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          . ./version.env
          out="$RUNNER_TEMP/cli"
          mkdir -p "$out"
          install -m 0755 "$BIN_DIR/CodexBarCLI" "$out/CodexBarCLI"
          ln -s CodexBarCLI "$out/codexbar"
          printf '%s\n' "$MARKETING_VERSION" > "$out/VERSION"
          cp -R "$BIN_DIR/CodexBar_CodexBarCore.resources" "$out/CodexBar_CodexBarCore.bundle" 2>/dev/null \
            || cp -R "$BIN_DIR/CodexBar_CodexBarCore.bundle" "$out/CodexBar_CodexBarCore.bundle"

          # Resources resolve, and this is the fork build with Machine Sync.
          CODEXBAR_RESOURCE_SMOKE=1 "$out/codexbar" | grep -Fx CODEXBAR_RESOURCE_SMOKE_OK
          # (Unpaired here, so only an unknown-command answer is a failure.)
          sync_out="$("$out/codexbar" sync status --json-only 2>&1 || true)"
          if grep -q "Unknown command" <<< "$sync_out"; then
            echo "CLI build lacks codexbar sync" >&2
            exit 1
          fi

          # Published on the release for install-cli.sh and the CLI packages,
          # named after the UsageBar version so their URLs are predictable.
          name="usagebar-cli-${VERSION}-linux-${ARCH}.tar.gz"
          mkdir -p "$RUNNER_TEMP/cli-tarball"
          tarball="$RUNNER_TEMP/cli-tarball/$name"
          (cd "$out" && tar czf "$tarball" CodexBarCLI codexbar VERSION CodexBar_CodexBarCore.bundle)
          (cd "$RUNNER_TEMP/cli-tarball" && sha256sum "$name" > "$name.sha256")
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Install-script smoke test
        env:
          TARBALL: ${{ steps.cli.outputs.tarball }}
        run: |
          set -euo pipefail
          for image in debian:stable registry.fedoraproject.org/fedora:latest; do
            echo "::group::install-cli.sh on $image"
            linux/packaging/tests/run-in-container.sh "$image" install-script.sh "$(dirname "$TARBALL")"
            echo "::endgroup::"
          done

      - name: Build .deb and .rpm
        env:
          TARBALL: ${{ steps.cli.outputs.tarball }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          linux/packaging/build-packages.sh "$TARBALL" "$VERSION" "$RUNNER_TEMP/packages"
          cp "$TARBALL" "$TARBALL.sha256" "$RUNNER_TEMP/packages/"
          linux/packaging/build-cli-rpm.sh "$VERSION" "$RUNNER_TEMP/packages" "$TARBALL"
          dpkg-deb --info "$RUNNER_TEMP"/packages/*.deb
          for rpm in "$RUNNER_TEMP"/packages/*.rpm; do rpm -qpil "$rpm" | head -40; done

      - name: CLI RPM smoke test
        run: linux/packaging/tests/run-in-container.sh registry.fedoraproject.org/fedora:latest rpm.sh "$RUNNER_TEMP/packages"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: usagebar-${{ matrix.arch }}
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error

  # A source RPM carrying both architectures' tarballs, which COPR or mock
  # can rebuild for either one.
  srpm:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: usagebar-*
          path: packages
          merge-multiple: true

      - name: Build SRPM
        id: srpm
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm
          tarballs=(packages/usagebar-cli-*-linux-x86_64.tar.gz packages/usagebar-cli-*-linux-aarch64.tar.gz)
          version=$(basename "${tarballs[0]}" | sed 's/^usagebar-cli-\(.*\)-linux-x86_64\.tar\.gz$/\1/')
          linux/packaging/build-cli-rpm.sh "$version" "$RUNNER_TEMP/all" "${tarballs[@]}"
          mkdir -p "$RUNNER_TEMP/srpm"
          cp "$RUNNER_TEMP"/all/*.src.rpm "$RUNNER_TEMP"/all/*.src.rpm.sha256 "$RUNNER_TEMP/srpm/"
          # The smoke test below needs the x86_64 RPM and tarball next to it.
          cp packages/usagebar-cli-*.x86_64.rpm packages/usagebar-cli-*-linux-x86_64.tar.gz* "$RUNNER_TEMP/all/"

      - name: SRPM rebuild smoke test
        run: linux/packaging/tests/run-in-container.sh registry.fedoraproject.org/fedora:latest rpm.sh "$RUNNER_TEMP/all"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: usagebar-srpm
          path: ${{ runner.temp }}/srpm/*
          if-no-files-found: error

  publish:
    needs: [package, srpm]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: usagebar-*
          path: packages
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${TAG#usagebar-v}
          notes="Download the file for your system and open it to install:

          - Ubuntu / Debian: \`usagebar_${version}_amd64.deb\` (ARM: \`_arm64.deb\`)
          - Fedora: \`usagebar-${version}-1.x86_64.rpm\` (ARM: \`.aarch64.rpm\`)
          - Just the \`codexbar\` CLI on Fedora: \`usagebar-cli-${version}-1.x86_64.rpm\` (ARM: \`.aarch64.rpm\`)
          - Just the \`codexbar\` CLI, any distro: \`curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${TAG}/linux/packaging/install-cli.sh | sh\`

          Then log out and back in once. Needs GNOME 46, 49 or 50 (Ubuntu 24.04 / 25.10 / 26.04, Fedora 43 / 44)."
          gh release create "$TAG" packages/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "UsageBar $version" \
            --notes "$notes"
