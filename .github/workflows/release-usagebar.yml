name: Release UsageBar

# UsageBar's own release (#36), built from one commit:
#
#   resolve  linux/release/resolve-version.sh: the tag (or, for a dispatch, the
#            metadata alone) -> version, CLI version string, asset names.
#   package  per arch: the fork's codexbar CLI (static Swift stdlib), packed in
#            upstream's tarball layout, smoke-tested, then (final releases
#            only) the .deb/.rpm packages and their container smoke tests.
#   srpm     final releases only: a source RPM with both arches' tarballs.
#   extension
#            the GNOME extension zip (the extensions.gnome.org build), after
#            the extension's Node and lint tests.
#   tray     per arch: the Tauri tray app (linux/codexbar-tray), after its
#            Rust tests, reporting the release version (usagebar-tray.yml).
#   verify   linux/release/verify-assets.sh over the whole asset set.
#   publish  tags only, after verify: the GitHub release (pre-release for a
#            semver pre-release).
#
# Pushing a usagebar-v<semver> tag publishes. A manual dispatch builds and
# verifies the selected ref and uploads the assets to the run, never
# publishing. The release is created with GITHUB_TOKEN, so upstream's
# release-triggered workflows (release-cli.yml and its Homebrew tap dispatch,
# release-linux-desktop.yml) don't fire for it; see linux/README.md.
#
# Adding an asset: build it in its own job (or a step of package), upload it in an artifact named usagebar-*, add its job to
# verify's needs, and teach verify-assets.sh to expect and check it. Its name
# comes from the resolve job's outputs.

on:
  push:
    tags: ['usagebar-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-usagebar-${{ github.ref }}
  cancel-in-progress: false

env:
  SWIFT_VERSION: 6.3.3
  SWIFTLY_VERSION: 1.1.3
  SWIFTLY_SIGNING_FINGERPRINT: E813C892820A6FA13755B268F167DF1ACF9CE069

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      upstream_base: ${{ steps.resolve.outputs.upstream_base }}
      upstream_tag: ${{ steps.resolve.outputs.upstream_tag }}
      cli_version: ${{ steps.resolve.outputs.cli_version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      distro_packages: ${{ steps.resolve.outputs.distro_packages }}
      cli_asset_x86_64: ${{ steps.resolve.outputs.cli_asset_x86_64 }}
      cli_asset_aarch64: ${{ steps.resolve.outputs.cli_asset_aarch64 }}
      extension_asset: ${{ steps.resolve.outputs.extension_asset }}
      extension_version_name: ${{ steps.resolve.outputs.extension_version_name }}
      tray_asset_x86_64: ${{ steps.resolve.outputs.tray_asset_x86_64 }}
      tray_asset_aarch64: ${{ steps.resolve.outputs.tray_asset_aarch64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: resolve
        env:
          # A dispatch resolves from the metadata at the selected ref.
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          linux/release/resolve-version.sh --format github ${TAG:+"$TAG"} | tee "$RUNNER_TEMP/resolved"
          {
            echo '### UsageBar release values'
            echo
            if [[ -z "$TAG" ]]; then echo 'Dry run: builds and verifies, never publishes.'; echo; fi
            echo '```'
            cat "$RUNNER_TEMP/resolved"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-24.04
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extension unit tests
        run: node --test linux/usagebar-gnome/tests/*.test.mjs

      - name: Restore Swift toolchain cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/swiftly
          key: swift-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_VERSION }}-swiftly-${{ env.SWIFTLY_VERSION }}

      - name: Install Swift ${{ env.SWIFT_VERSION }} via swiftly
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ca-certificates gpg libcurl4-openssl-dev libsqlite3-dev \
            rpm libglib2.0-bin

          SWIFTLY_ARCH="$(uname -m)"
          SWIFTLY_ARCHIVE="$RUNNER_TEMP/swiftly-${SWIFTLY_VERSION}-${SWIFTLY_ARCH}.tar.gz"
          SWIFTLY_SIGNATURE="${SWIFTLY_ARCHIVE}.sig"
          SWIFTLY_HOME_DIR="$HOME/.local/share/swiftly"
          SWIFTLY_BIN_DIR="$HOME/.local/bin"
          SWIFT_GNUPGHOME="$(mktemp -d)"
          SWIFT_KEYS="$RUNNER_TEMP/swift-signing-keys.asc"
          POST_INSTALL_SCRIPT="$(mktemp)"

          mkdir -p "$SWIFTLY_BIN_DIR"
          chmod 700 "$SWIFT_GNUPGHOME"
          curl -fsSL "https://download.swift.org/swiftly/linux/swiftly-${SWIFTLY_VERSION}-${SWIFTLY_ARCH}.tar.gz" -o "$SWIFTLY_ARCHIVE"
          curl -fsSL "https://download.swift.org/swiftly/linux/swiftly-${SWIFTLY_VERSION}-${SWIFTLY_ARCH}.tar.gz.sig" -o "$SWIFTLY_SIGNATURE"
          curl -fsSL --compressed "https://www.swift.org/keys/all-keys.asc" -o "$SWIFT_KEYS"
          GNUPGHOME="$SWIFT_GNUPGHOME" gpg --batch --import "$SWIFT_KEYS"
          SIGNATURE_STATUS="$(GNUPGHOME="$SWIFT_GNUPGHOME" gpg --batch --status-fd=1 \
            --verify "$SWIFTLY_SIGNATURE" "$SWIFTLY_ARCHIVE" 2>&1)"
          printf '%s\n' "$SIGNATURE_STATUS"
          grep -Fq "[GNUPG:] VALIDSIG ${SWIFTLY_SIGNING_FINGERPRINT} " <<< "$SIGNATURE_STATUS"
          tar -xzf "$SWIFTLY_ARCHIVE" -C /tmp
          /tmp/swiftly init --assume-yes --skip-install

          . "$SWIFTLY_HOME_DIR/env.sh"
          echo "$SWIFTLY_BIN_DIR" >> "$GITHUB_PATH"
          echo "SWIFTLY_HOME_DIR=$SWIFTLY_HOME_DIR" >> "$GITHUB_ENV"
          echo "SWIFTLY_BIN_DIR=$SWIFTLY_BIN_DIR" >> "$GITHUB_ENV"

          swiftly install "$SWIFT_VERSION" --use --assume-yes --verify --post-install-file "$POST_INSTALL_SCRIPT"
          if [[ -s "$POST_INSTALL_SCRIPT" ]]; then
            sudo apt-get update
            sudo bash "$POST_INSTALL_SCRIPT"
          fi

          hash -r
          swift --version

      - name: Build CodexBarCLI (release, static Swift stdlib)
        id: build
        run: |
          set -euo pipefail
          swift build -c release --product CodexBarCLI --static-swift-stdlib
          echo "bin_dir=$(swift build -c release --product CodexBarCLI --static-swift-stdlib --show-bin-path)" >> "$GITHUB_OUTPUT"

      # Upstream's tarball layout, with VERSION set to the CLI version string
      # (<base>+usagebar.<semver>). install-cli.sh, the CLI packages and
      # build-packages.sh all unpack it as is.
      - name: Package CLI tarball
        id: cli
        env:
          BIN_DIR: ${{ steps.build.outputs.bin_dir }}
          CLI_VERSION: ${{ needs.resolve.outputs.cli_version }}
          ASSET: ${{ needs.resolve.outputs[format('cli_asset_{0}', matrix.arch)] }}
        run: |
          set -euo pipefail
          tarball=$(linux/release/package-cli.sh "$BIN_DIR" "$CLI_VERSION" "$RUNNER_TEMP/cli-tarball" "$ASSET")
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: CLI smoke test
        env:
          TARBALL: ${{ steps.cli.outputs.tarball }}
          CLI_VERSION: ${{ needs.resolve.outputs.cli_version }}
        run: linux/release/smoke-cli.sh "$TARBALL" "$CLI_VERSION"

      - name: Collect release assets
        env:
          TARBALL: ${{ steps.cli.outputs.tarball }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/packages"
          cp "$TARBALL" "$TARBALL.sha256" "$RUNNER_TEMP/packages/"

      - name: Install-script smoke test
        env:
          TARBALL: ${{ steps.cli.outputs.tarball }}
        run: |
          set -euo pipefail
          for image in debian:stable registry.fedoraproject.org/fedora:latest; do
            echo "::group::install-cli.sh on $image"
            linux/packaging/tests/run-in-container.sh "$image" install-script.sh "$(dirname "$TARBALL")"
            echo "::endgroup::"
          done

      # Distro packages can't carry a semver pre-release in their version
      # fields, so pre-releases ship the tarballs only (distro_packages=false).
      - name: Build .deb and .rpm
        if: needs.resolve.outputs.distro_packages == 'true'
        env:
          TARBALL: ${{ steps.cli.outputs.tarball }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          linux/packaging/build-packages.sh "$TARBALL" "$VERSION" "$RUNNER_TEMP/packages"
          linux/packaging/build-cli-deb.sh "$TARBALL" "$VERSION" "$RUNNER_TEMP/packages"
          linux/packaging/build-cli-rpm.sh "$VERSION" "$RUNNER_TEMP/packages" "$TARBALL"
          for deb in "$RUNNER_TEMP"/packages/*.deb; do dpkg-deb --info "$deb"; done
          for rpm in "$RUNNER_TEMP"/packages/*.rpm; do rpm -qpil "$rpm" | head -40; done

      - name: CLI RPM smoke test
        if: needs.resolve.outputs.distro_packages == 'true'
        run: linux/packaging/tests/run-in-container.sh registry.fedoraproject.org/fedora:latest rpm.sh "$RUNNER_TEMP/packages"

      - name: CLI .deb smoke test
        if: needs.resolve.outputs.distro_packages == 'true'
        run: |
          set -euo pipefail
          for image in debian:stable ubuntu:24.04 ubuntu:latest; do
            echo "::group::usagebar-cli .deb on $image"
            linux/packaging/tests/run-in-container.sh "$image" deb.sh "$RUNNER_TEMP/packages"
            echo "::endgroup::"
          done

      - name: AUR PKGBUILD smoke test
        # The archlinux image is x86_64 only.
        if: matrix.arch == 'x86_64' && needs.resolve.outputs.distro_packages == 'true'
        env:
          TARBALL: ${{ steps.cli.outputs.tarball }}
        run: linux/packaging/tests/run-in-container.sh archlinux:latest aur.sh "$(dirname "$TARBALL")"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: usagebar-${{ matrix.arch }}
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error

  # A source RPM carrying both architectures' tarballs, which COPR or mock
  # can rebuild for either one.
  srpm:
    needs: [resolve, package]
    if: needs.resolve.outputs.distro_packages == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: usagebar-*
          path: packages
          merge-multiple: true

      - name: Build SRPM
        id: srpm
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          CLI_X86_64: ${{ needs.resolve.outputs.cli_asset_x86_64 }}
          CLI_AARCH64: ${{ needs.resolve.outputs.cli_asset_aarch64 }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm
          linux/packaging/build-cli-rpm.sh "$VERSION" "$RUNNER_TEMP/all" "packages/$CLI_X86_64" "packages/$CLI_AARCH64"
          mkdir -p "$RUNNER_TEMP/srpm"
          cp "$RUNNER_TEMP"/all/*.src.rpm "$RUNNER_TEMP"/all/*.src.rpm.sha256 "$RUNNER_TEMP/srpm/"
          # The smoke test below needs the x86_64 RPM and tarball next to it.
          cp packages/usagebar-cli-*.x86_64.rpm "packages/$CLI_X86_64" "packages/$CLI_X86_64.sha256" "$RUNNER_TEMP/all/"

      - name: SRPM rebuild smoke test
        run: linux/packaging/tests/run-in-container.sh registry.fedoraproject.org/fedora:latest rpm.sh "$RUNNER_TEMP/all"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: usagebar-srpm
          path: ${{ runner.temp }}/srpm/*
          if-no-files-found: error

  # The GNOME extension zip: the extensions.gnome.org build (allowlisted
  # files, no brand logos, lint must pass) with metadata.json "version-name"
  # set to the release version. The checked-in metadata.json is unchanged.
  extension:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extension unit tests
        run: node --test linux/usagebar-gnome/tests/*.test.mjs

      - name: EGO ZIP lint tests
        run: python3 -m unittest discover -s linux/usagebar-gnome/tests -p 'test_*.py'

      - name: Build extension zip
        env:
          VERSION_NAME: ${{ needs.resolve.outputs.extension_version_name }}
          ASSET: ${{ needs.resolve.outputs.extension_asset }}
        run: linux/release/package-extension.sh "$VERSION_NAME" "$RUNNER_TEMP/extension" "$ASSET"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: usagebar-extension
          path: ${{ runner.temp }}/extension/*
          if-no-files-found: error

  # The tray app, per arch, after its Rust tests (usagebar-tray.yml).
  tray:
    needs: resolve
    uses: ./.github/workflows/usagebar-tray.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      asset_x86_64: ${{ needs.resolve.outputs.tray_asset_x86_64 }}
      asset_aarch64: ${{ needs.resolve.outputs.tray_asset_aarch64 }}

  # The release asset verifier over everything publish would attach. srpm is
  # skipped for pre-releases; any failed or cancelled job skips verify, and
  # with it publish.
  verify:
    needs: [resolve, package, srpm, extension, tray]
    if: ${{ !cancelled() && needs.package.result == 'success' && (needs.srpm.result == 'success' || needs.srpm.result == 'skipped') && needs.extension.result == 'success' && needs.tray.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: usagebar-*
          path: assets
          merge-multiple: true

      - name: Verify release assets
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          linux/release/resolve-version.sh ${TAG:+"$TAG"} > "$RUNNER_TEMP/resolved"
          ls -l assets
          linux/release/verify-assets.sh "$RUNNER_TEMP/resolved" assets

  publish:
    needs: [resolve, verify]
    if: ${{ !cancelled() && needs.verify.result == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/usagebar-v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: usagebar-*
          path: packages
          merge-multiple: true

      # Placeholder notes; #48 replaces this step with generated ones.
      - name: Release notes
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          UPSTREAM_BASE: ${{ needs.resolve.outputs.upstream_base }}
          UPSTREAM_TAG: ${{ needs.resolve.outputs.upstream_tag }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
          DISTRO_PACKAGES: ${{ needs.resolve.outputs.distro_packages }}
        run: |
          set -euo pipefail
          notes=$RUNNER_TEMP/notes.md
          {
            echo "Based on [CodexBar $UPSTREAM_BASE](https://github.com/steipete/CodexBar/releases/tag/$UPSTREAM_TAG)."
            echo
            if [[ "$PRERELEASE" == true ]]; then
              echo "**Pre-release** for testing: the CLI and tray tarballs and the extension zip, no .deb/.rpm packages."
              echo
            fi
            if [[ "$DISTRO_PACKAGES" == true ]]; then
              echo "Download the file for your system and open it to install:"
              echo
              echo "- Ubuntu / Debian: \`usagebar_${VERSION}_amd64.deb\` (ARM: \`_arm64.deb\`)"
              echo "- Fedora: \`usagebar-${VERSION}-1.x86_64.rpm\` (ARM: \`.aarch64.rpm\`)"
              echo "- Just the \`codexbar\` CLI on Ubuntu / Debian: \`usagebar-cli_${VERSION}_amd64.deb\` (ARM: \`_arm64.deb\`)"
              echo "- Just the \`codexbar\` CLI on Fedora: \`usagebar-cli-${VERSION}-1.x86_64.rpm\` (ARM: \`.aarch64.rpm\`)"
              echo "- Just the \`codexbar\` CLI on Arch: the \`usagebar-cli-bin\` PKGBUILD in \`linux/packaging/aur\`"
            fi
            echo "- Just the \`codexbar\` CLI, any distro: \`curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${TAG}/linux/packaging/install-cli.sh | sh -s -- ${VERSION}\`"
            echo
            echo "Every file has a \`.sha256\`: \`sha256sum -c <file>.sha256\`."
            if [[ "$DISTRO_PACKAGES" == true ]]; then
              echo
              echo "Then log out and back in once. Needs GNOME 46, 49 or 50 (Ubuntu 24.04 / 25.10 / 26.04, Fedora 43 / 44)."
            fi
          } > "$notes"
          cat "$notes"
          echo "notes=$notes" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" packages/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "UsageBar $VERSION" \
            --notes-file "$notes" \
            "${flags[@]}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.resolve.outputs.distro_packages == 'true'
        with:
          path: src
          persist-credentials: false

      # The PKGBUILD and .SRCINFO for this release, for whoever pushes to the AUR.
      - name: Bump AUR PKGBUILD
        if: needs.resolve.outputs.distro_packages == 'true'
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          USAGEBAR_REPO: ${{ github.repository }}
        run: src/linux/packaging/aur/bump.sh "$VERSION"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: needs.resolve.outputs.distro_packages == 'true'
        with:
          name: aur-usagebar-cli-bin
          path: |
            src/linux/packaging/aur/PKGBUILD
            src/linux/packaging/aur/.SRCINFO
          include-hidden-files: true
          if-no-files-found: error
