<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodexBar</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --border: rgba(0, 0, 0, 0.10);
    --track: rgba(0, 0, 0, 0.08);
    --ok: #34c759;
    --warn: #ff9f0a;
    --crit: #ff453a;
    --stale: #98989d;
    --accent: #0071e3;
    --badge-bg: rgba(0, 113, 227, 0.12);
    --banner-bg: rgba(255, 159, 10, 0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e20;
      --card: #2a2a2d;
      --text: #f5f5f7;
      --muted: #98989d;
      --border: rgba(255, 255, 255, 0.10);
      --track: rgba(255, 255, 255, 0.10);
      --accent: #409cff;
      --badge-bg: rgba(64, 156, 255, 0.18);
      --banner-bg: rgba(255, 159, 10, 0.16);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 10px;
    user-select: none;
    cursor: default;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px 6px;
    flex: none;
  }
  header .title { font-weight: 600; font-size: 13px; color: var(--muted); }
  header button {
    all: unset;
    width: 22px; height: 22px;
    text-align: center;
    line-height: 22px;
    border-radius: 6px;
    color: var(--muted);
    font-size: 15px;
    cursor: pointer;
  }
  header button:hover { background: var(--track); color: var(--text); }

  nav#tabs {
    display: flex;
    gap: 6px;
    padding: 0 12px 10px;
    flex: none;
  }
  .tab {
    flex: 1;
    padding: 7px 10px 8px;
    border-radius: 8px;
    border: 1px solid transparent;
    cursor: pointer;
    background: transparent;
    font: inherit;
    color: inherit;
    text-align: left;
  }
  .tab:hover { background: var(--track); }
  .tab.active { background: var(--card); border-color: var(--border); }
  .tab .name { font-weight: 600; font-size: 12.5px; display: block; margin-bottom: 6px; }
  .tab .mini { display: block; height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; }
  .tab .mini > i { display: block; height: 100%; border-radius: 2px; }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 0 12px 8px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }
  .card-head { display: flex; align-items: baseline; gap: 8px; }
  .card-head h2 { font-size: 16px; font-weight: 700; }
  .badge {
    font-size: 10.5px;
    font-weight: 600;
    padding: 1px 7px;
    border-radius: 20px;
    background: var(--badge-bg);
    color: var(--accent);
    text-transform: capitalize;
  }
  .badge.stale { background: var(--track); color: var(--muted); text-transform: none; }
  .updated { color: var(--muted); font-size: 11.5px; margin-top: 2px; }

  .banner {
    margin-top: 10px;
    padding: 7px 10px;
    border-radius: 8px;
    background: var(--banner-bg);
    font-size: 12px;
  }

  .window { margin-top: 14px; }
  .window .row1 { display: flex; justify-content: space-between; align-items: baseline; }
  .window .label { font-weight: 600; font-size: 12.5px; }
  .window .reset { color: var(--muted); font-size: 11.5px; }
  .bar { margin-top: 6px; height: 7px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 4px; transition: width .3s ease; }
  .fill-ok { background: var(--ok); }
  .fill-warn { background: var(--warn); }
  .fill-crit { background: var(--crit); }
  .fill-stale { background: var(--stale); }
  .window .row2 { display: flex; justify-content: space-between; margin-top: 4px; }
  .window .pct { font-size: 11.5px; color: var(--muted); }
  .pace { margin-top: 3px; font-size: 11.5px; color: var(--muted); }

  .section-title {
    margin-top: 16px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .cost-row {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 12.5px;
  }
  .cost-row .k { color: var(--muted); }
  .cost-row .v { font-variant-numeric: tabular-nums; }
  .cost-note { margin-top: 6px; font-size: 11.5px; color: var(--muted); }

  .placeholder { padding: 30px 10px; text-align: center; color: var(--muted); }

  footer { flex: none; padding: 8px 12px 12px; }
  #links { display: flex; gap: 4px; flex-wrap: wrap; }
  #links a {
    color: var(--accent);
    font-size: 12px;
    cursor: pointer;
    padding: 3px 6px;
    border-radius: 6px;
    text-decoration: none;
  }
  #links a:hover { background: var(--track); }
  #links a.quit { margin-left: auto; color: var(--muted); }
  #settings-note {
    margin-top: 6px;
    font-size: 11.5px;
    color: var(--muted);
  }
  #settings-note code { font-family: ui-monospace, monospace; font-size: 11px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <header data-tauri-drag-region>
    <span class="title" data-tauri-drag-region>CodexBar</span>
    <button id="close" title="Hide (Esc)">✕</button>
  </header>
  <nav id="tabs"></nav>
  <main id="main"></main>
  <footer>
    <div id="links">
      <a id="link-dashboard">Usage Dashboard</a>
      <a id="link-status">Status Page</a>
      <a id="link-settings">Settings…</a>
      <a id="link-quit" class="quit">Quit</a>
    </div>
    <div id="settings-note" hidden>
      No settings UI yet — configuration lives in <code>~/.config/codexbar/</code>;
      manage it with <code>codexbar config</code> in a terminal.
    </div>
  </footer>
  <script src="app.js"></script>
</body>
</html>
