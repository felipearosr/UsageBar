[package]
name = "codexbar-tray"
version = "0.1.0"
description = "Linux tray app for CodexBar — AI coding-provider limits in your system tray"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Loopback HTTP only — no TLS needed.
ureq = { version = "2", default-features = false }
tiny-skia = "0.11"
time = { version = "0.3", features = ["parsing", "macros"] }
anyhow = "1"
libc = "0.2"

[profile.release]
strip = true
lto = true
