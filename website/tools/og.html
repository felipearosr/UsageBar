<!doctype html>
<!-- Source of assets/og.png, the link-preview image. Open at 1200x630 and screenshot it (see website/README.md). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>UsageBar social card</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: radial-gradient(60% 80% at 78% 30%, rgb(86 116 255 / 34%), transparent 70%), #0a0d18;
    color: #eef1f8; font-family: "Inter", "Adwaita Sans", system-ui, sans-serif;
  }
  .text { position: absolute; left: 72px; top: 76px; width: 580px; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
  .brand svg { width: 40px; height: 40px; }
  h1 { margin-top: 72px; font-size: 62px; text-wrap: balance; line-height: 1.04; letter-spacing: -0.035em; }
  .bar { width: 250px; height: 9px; margin-top: 30px; border-radius: 9px;
    background: linear-gradient(90deg, #3ddc97 0 52%, #f5c542 52% 80%, #ff6b6b 80%); }
  p { margin-top: 30px; color: #a6afc6; font-size: 27px; line-height: 1.4; }
  img { position: absolute; left: 690px; top: 56px; width: 560px; border-radius: 18px;
    border: 1px solid rgb(255 255 255 / 16%); box-shadow: 0 40px 90px -20px rgb(0 0 0 / 80%); }
</style>
</head>
<body>
  <div class="text">
    <div class="brand">
      <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="5"/><path d="M16 5a11 11 0 1 1-10.46 7.6" fill="none" stroke="#3ddc97" stroke-width="5" stroke-linecap="round"/></svg>
      UsageBar
    </div>
    <h1>Every AI coding limit, in your top bar.</h1>
    <div class="bar"></div>
    <p>Quota, reset times and spend for GNOME. Free and open source.</p>
  </div>
  <img src="../assets/screenshots/popover-dark.webp" alt="">
</body>
</html>
